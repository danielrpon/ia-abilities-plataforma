<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="css/app.css?v=2026-10-29p">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="fn">freaknerd <i>_</i></div>
      <div class="who">Panel del facilitador · <span id="ses"></span></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="rec-alert" id="grab" role="status" aria-live="assertive" hidden></div>
</header>
<main id="main"></main>
<script src="vendor/supabase.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="js/config.js?v=2026-10-29p"></script>
<script src="js/db.js?v=2026-10-29p"></script>
<script src="js/contenido.js?v=2026-10-29p"></script>

<script>
const { $, esc } = U;
let S = null, TAB = 'sesion', ENC_VER = null, firma = '', armadoBorrar = false, GRAB = null;
/* Grupos: PART = participantes con su grupo (de la base); PREV = vista previa sin publicar */
let PART = null, PREV = null, G_OPC = { modo: 'area', tam: 4 }, armadoGrupos = false;
const G_VENTANA_MIN = 3;   // activo = hizo ping (cada 60 s) en los últimos 3 minutos
const G_AREAS = { mp: ['Mercadeo y catálogo', 'Comercial', 'Diseño y contenido', 'Demanda y pronóstico', 'Dirección y servicio', 'Otra'],
                  pco: ['Compensación', 'Selección', 'Nómina', 'Talento y bienestar', 'Plataformas core', 'Otra'] }[U.C];
/* 29-oct (Daniel): con grupos mezclados en MP, cada grupo recibe su caso al formar (grupo 1 → pedidos, 2 → ventas, 3 → demanda, 4 → comentarios, y vuelve a empezar).
   El brief (Diseño y contenido) no entra: ya se vio en la demo. En PCO no se asigna nada (su N2 es de Juan). */
const G_CASOS = { mp: ['Comercial', 'Mercadeo y catálogo', 'Demanda y pronóstico', 'Dirección y servicio'], pco: ['Nómina', 'Compensación', 'Selección', 'Talento y bienestar'] }[U.C] || null;
const conCasos = filas => (G_OPC.modo === 'mezclados' && G_CASOS) ? filas.map(f => Object.assign({}, f, { mesa: G_CASOS[(f.grupo - 1) % G_CASOS.length] })) : filas;
$('#ses').textContent = DB.SES;

function login(){
  $('#tabs').innerHTML = '';
  $('#main').innerHTML = `<div class="kick">Facilitador</div><h1>Entrar al panel</h1>
    <form class="card-box" id="lg"><label class="field"><span>Clave de la sesión</span><input type="password" id="clave" autocomplete="current-password" required></label>
    <div class="prompt-a" style="padding:14px 0 0"><button class="btn" type="submit">Entrar</button></div><div class="err" id="lg-err"></div>
    ${DB.MODE === 'local' ? '<p class="hint">Modo práctica: la clave es «admin».</p>' : ''}</form>`;
  $('#lg').addEventListener('submit', async e => {
    e.preventDefault();
    const c = $('#clave').value;
    try { await DB.admin('login', {}, c); DB.setClave(c); arrancar(); } catch (x) { $('#lg-err').textContent = U.errMsg(x); }
  });
}

function tabs(){
  const it = [['sesion', 'Sesión'], ['acts', 'Capítulos'], ['enc', 'Encuestas'], ['grupos', 'Grupos'], ['muro', 'Muro']];
  $('#tabs').innerHTML = it.map(([id, l]) => `<button class="tab" data-tab="${id}" aria-selected="${TAB === id}">${l}</button>`).join('');
}

/* Grabación: se revisa en cada ciclo, en cualquier pestaña. Solo conteos: nadie queda expuesto por nombre. */
async function grabacion(){
  const el = $('#grab');
  try { GRAB = await DB.grabacion(); }
  catch (x) { el.hidden = false; el.className = 'rec-alert sin'; el.innerHTML = `<b>Grabación</b><span>${esc(U.errMsg(x))}</span>`; return; }
  const { si, no, sin } = GRAB, pers = n => n === 1 ? '1 persona' : n + ' personas';
  el.hidden = !(si || no || sin);
  if (no) { el.className = 'rec-alert no'; el.innerHTML = `<b>■ Detenga la grabación</b><span>${pers(no)} no ${no === 1 ? 'autoriza' : 'autorizan'} que se grabe esta sesión.</span>`; }
  else if (sin) { el.className = 'rec-alert sin'; el.innerHTML = `<b>Grabación en espera</b><span>${pers(sin)} no ${sin === 1 ? 'ha' : 'han'} respondido. No grabe hasta que respondan.</span>`; }
  else { el.className = 'rec-alert si'; el.innerHTML = `<b>● Grabación autorizada</b><span>${si === 1 ? 'La persona registrada la autoriza.' : `Las ${si} personas registradas la autorizan.`}</span>`; }
}
function csvGrabacion(){
  const rows = (GRAB && GRAB.rows) || [];
  if (!rows.length) return U.toast('Aún no hay autorizaciones.');
  const q = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
  const csv = '\ufeff' + [['fecha', 'nombre', 'area', 'decision', 'version_del_texto'].join(',')]
    .concat(rows.map(r => [new Date(r.created_at).toLocaleString('es-CO'), r.nombre, r.area, r.graba ? 'autoriza' : 'no autoriza', r.texto_ver].map(q).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `autorizaciones-grabacion-${DB.SES}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Biblioteca de prompts: todo lo publicado en la sesión (también lo oculto), sin ids de personas */
async function csvPublicaciones(){
  let rows = [];
  try { rows = (await DB.admin('publicaciones')).rows || []; } catch (x) { return U.toast(U.errMsg(x)); }
  if (!rows.length) return U.toast('Aún no hay publicaciones.');
  rows.sort((a, b) => a.created_at.localeCompare(b.created_at));
  const q = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
  const csv = '\ufeff' + [['fecha', 'nombre', 'actividad', 'tipo', 'estado', 'me_sirve', 'texto'].join(',')]
    .concat(rows.map(r => [new Date(r.created_at).toLocaleString('es-CO'), r.nombre, U.actLabel(r.act_id), U.TIPOS[r.tipo] || r.tipo, r.estado, r.votos, r.texto].map(q).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `publicaciones-${DB.SES}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const base = () => location.href.replace(/admin\.html.*$/, '');
const linkPart = () => base() + 'index.html?s=' + encodeURIComponent(DB.SES);
const linkMuro = () => base() + 'muro.html?s=' + encodeURIComponent(DB.SES) + '&proyectar=1';

async function vSesion(){
  let parts = [];
  try { parts = (await DB.admin('participantes')).rows || []; } catch (e) {}
  $('#main').innerHTML = `<div class="kick">Sesión</div><h1>${esc(S.nombre || DB.SES)}</h1>
    <div class="stats"><span><b>${parts.length}</b>participantes</span><span><b>${(S.habilitadas || []).length}</b>actividades abiertas</span><span><b>${S.encuesta ? 'Sí' : 'No'}</b>encuesta abierta</span>${GRAB ? `<span><b>${GRAB.si}/${GRAB.si + GRAB.no + GRAB.sin}</b>autorizan grabar</span>` : ''}</div>
    ${S.actual ? `<div class="now"><span class="pulse"></span><span><span class="l">Ahora en la sala</span><br><span class="t">${esc(U.actLabel(S.actual))}</span></span></div>` : ''}
    <div class="card-box"><div class="kick">Enlace para los participantes</div>
      <p class="hint" style="word-break:break-all">${esc(linkPart())}</p><div class="qr" id="qr"></div>
      <div class="prompt-a" style="padding:12px 0 0"><button class="btn" data-cp="part">${U.ICON_COPY}Copiar enlace</button><a class="btn alt" href="${esc(linkMuro())}" target="_blank" rel="noopener" style="text-decoration:none">Proyectar el muro</a></div></div>
    <div class="card-box"><div class="kick">Autorizaciones de grabación</div><p class="hint">Cada decisión queda guardada con fecha, nombre y versión del texto: es la prueba que pide la Ley 1581. Descárguelas al cerrar cada sesión y guárdelas en la carpeta del cliente.</p>
      <div class="prompt-a" style="padding:12px 0 0"><button class="btn alt" data-csv="1">Descargar autorizaciones (CSV)</button></div></div>
    <div class="card-box"><div class="kick">Biblioteca de prompts</div><p class="hint">Todo lo que el grupo publicó en el muro, en todos los niveles (también lo oculto). Descárguela al cerrar cada sesión.</p>
      <div class="prompt-a" style="padding:12px 0 0"><button class="btn alt" data-csvpub="1">Descargar publicaciones (CSV)</button></div></div>
    <div class="card-box"><div class="kick">Reiniciar la sesión</div><p class="hint">Borra participantes, publicaciones, votos y respuestas, y cierra todas las actividades. Úselo solo después de un ensayo, <b>nunca entre sesiones del mismo programa</b>: se pierden los prompts que el grupo retoma de un nivel a otro. Las autorizaciones de grabación no se borran.</p>
      <div class="prompt-a" style="padding:12px 0 0"><button class="btn alt" data-borrar="1">${armadoBorrar ? 'Toque otra vez para confirmar' : 'Reiniciar'}</button></div></div>`;
  try { new QRCode($('#qr'), { text: linkPart(), width: 168, height: 168 }); } catch (e) {}
}

function vActs(){
  const hab = new Set(S.habilitadas || []);
  $('#main').innerHTML = `<div class="kick">Capítulos y tarjetas</div><h1>Abra el contenido a medida que avanza</h1>
    <p class="lede">«Ahora en la sala ›» lleva todos los celulares a ese capítulo y abre sus tarjetas. «Foco ›» los lleva a una sola tarjeta (y la abre). El interruptor abre o cierra una tarjeta sin moverlos.</p>` +
    NIVELES.filter(N => N.capitulos).map(N => `<div class="card-box"><div class="kick">Nivel 0${N.id} · ${N.verbo}</div>
      <div class="prompt-a" style="padding:10px 0 4px"><button class="mini" data-nivel="${N.id}" data-on="1">Abrir todo el nivel</button><button class="mini" data-nivel="${N.id}" data-on="0">Cerrar el nivel</button></div>
      ${N.capitulos.map((c, ci) => `<div class="adm-row ${S.actual === c.id ? 'cur' : ''}" style="grid-template-columns:1fr auto"><span><span class="t">${esc(c.m || "C" + ci)} · ${esc(c.t)}</span><br><span class="m">${c.min}</span></span>
          <button class="mini ${S.actual === c.id ? 'on' : ''}" data-cap="${c.id}">${S.actual === c.id ? 'Ahora en la sala' : 'Ahora en la sala ›'}</button></div>
        ${c.tarjetas.map(x => `<div class="adm-row" style="padding-left:14px"><span><span class="t" style="font-weight:600">${esc(U.cod(x))} · ${esc(x.t)} <span style="font-weight:500;opacity:.6">(${x.id})</span></span><br><span class="m">${x.tipo}${x.muro ? ' · muro' : ''}${x.encuesta ? ' · encuesta' : ''}</span></span><button class="mini ${S.actual === x.id ? 'on' : ''}" data-foco="${x.id}">${S.actual === x.id ? 'Foco' : 'Foco ›'}</button>
          <button class="switch" role="switch" aria-checked="${hab.has(x.id)}" aria-label="Abrir ${esc(x.t)}" data-hab="${x.id}"></button></div>`).join('')}`).join('')}</div>`).join('');
}

async function vEnc(){
  const E = ENC_VER ? ENCUESTAS.find(x => x.id === ENC_VER) : null;
  let rows = [];
  if (E) { try { rows = (await DB.admin('respuestas', { encuesta_id: E.id })).rows || []; } catch (e) {} }
  const res = E ? U.resultados(E, rows, true) : '';
  const enMuro = id => S.muestra === id;
  $('#main').innerHTML = `<div class="kick">Encuestas</div><h1>Pregunte y vea el grupo en conjunto</h1>
    <p class="lede">Al abrir una encuesta, aparece en todos los celulares. «Al muro» muestra los resultados en el muro proyectado, en lugar de las publicaciones. Los resultados nunca se muestran por persona.</p>
    <div class="card-box">${ENCUESTAS.map(x => `<div class="adm-row enc-row ${S.encuesta === x.id ? 'cur' : ''}"><span class="t">${esc(x.titulo)}${enMuro(x.id) ? '<br><span class="m">En el muro</span>' : ''}</span>
      <button class="mini" data-ver="${x.id}">Resultados</button>
      <button class="mini ${enMuro(x.id) ? 'on' : ''}" data-mues="${x.id}">${enMuro(x.id) ? 'Quitar del muro' : 'Al muro'}</button>
      <button class="mini ${S.encuesta === x.id ? 'on' : ''}" data-enc="${x.id}">${S.encuesta === x.id ? 'Cerrar' : 'Abrir'}</button></div>`).join('')}</div>
    ${E ? `<div class="card-box"><div class="kick">${esc(E.titulo)}</div>${res}</div>` : ''}`;
}

async function vMuro(){
  let rows = [];
  try { rows = (await DB.admin('publicaciones')).rows || []; } catch (e) {}
  rows.sort((a, b) => b.created_at.localeCompare(a.created_at));
  $('#main').innerHTML = `<div class="kick">Muro</div><h1>Modere y destaque</h1>
    <p class="lede">Oculte lo que tenga datos de personas o no corresponda. Destaque lo que quiere comentar en la sala.</p>
    <div class="posts">${rows.map(p => `<article class="post ${p.estado === 'destacada' ? 'dest' : ''}">
      <div class="meta"><span>${esc(U.actLabel(p.act_id))} · ${esc(U.TIPOS[p.tipo] || '')}</span><span>${esc(p.estado)} · ♥ ${p.votos}</span></div>
      <div class="who-p">${esc(p.nombre)}</div><pre>${esc(p.texto)}</pre>
      <div class="acts-p"><button class="mini" data-est="${p.id}" data-val="${p.estado === 'destacada' ? 'visible' : 'destacada'}">${p.estado === 'destacada' ? 'Quitar destacado' : 'Destacar'}</button>
      <button class="mini" data-est="${p.id}" data-val="${p.estado === 'oculta' ? 'visible' : 'oculta'}">${p.estado === 'oculta' ? 'Mostrar' : 'Ocultar'}</button></div></article>`).join('') || '<p class="hint">Sin publicaciones.</p>'}</div>`;
}


/* GRUPOS: forma grupos con las personas activas (por área o mezclados), con roles que rotan.
   «Formar» muestra una vista previa; «Publicar» la guarda y aparece en cada celular. */
/* Tras mover: una mesa mixta que quedó con una sola área pasa a ser la mesa de esa área */
function ajustarMesas(filas){
  const por = {}; filas.forEach(f => (por[f.grupo] = por[f.grupo] || []).push(f));
  Object.values(por).forEach(g => {
    const as = [...new Set(g.map(f => (PART.find(p => p.id === f.pid) || {}).area || ''))];
    if (!g[0].mesa && as.length === 1 && as[0] && as[0] !== 'Otra') g.forEach(f => { f.mesa = as[0]; });
  });
  return filas;
}
const filasDe = parts => parts.filter(p => p.grupo).map(p => ({ pid: p.id, grupo: p.grupo, rol: p.rol, mesa: p.mesa || '', orden: p.orden || 0 }));
async function cargarPart(){ PART = await DB.gruposAdmin(G_VENTANA_MIN); return PART; }
function tablaGrupos(filas, previa){
  const por = {}; filas.forEach(f => (por[f.grupo] = por[f.grupo] || []).push(f));
  const k = Object.keys(por).length, P = id => PART.find(p => p.id === id) || {};
  const opts = cur => Array.from({ length: k }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === cur ? 'selected' : ''}>Grupo ${n}</option>`).join('') + '<option value="nuevo">Grupo nuevo</option>';
  return Object.keys(por).sort((a, b) => a - b).map(g => {
    const m = por[g].sort((a, b) => a.orden - b.orden), mesa = m[0].mesa;
    const areas = [...new Set(m.map(f => P(f.pid).area || '—'))];
    return `<div class="card-box grp"><div class="kick">Grupo ${g} · ${esc(mesa || 'Mesa mixta')} · ${m.length} ${m.length === 1 ? 'persona' : 'personas'}</div>
      ${!mesa ? `<p class="hint" style="margin-top:2px">Áreas: ${esc(areas.join(', '))}</p>` : ''}
      ${m.map(f => { const p = P(f.pid); return `<div class="adm-row grp-row"><span><span class="t">${esc(p.corto || '?')}</span>${p.activo === false ? ' <span class="tag draft" style="margin-top:0">inactivo</span>' : ''}<br>
        <span class="m">${esc(GRUPOS.ROLES[f.rol] ? GRUPOS.ROLES[f.rol].t : f.rol)} · ${esc(p.area || '')}${p.escalon != null ? ' · E' + p.escalon : ''}</span></span>
        <select class="mini" aria-label="Mover a ${esc(p.corto || '')}" data-mover="${esc(f.pid)}" data-previa="${previa ? 1 : ''}">${opts(f.grupo)}</select></div>`; }).join('')}</div>`;
  }).join('');
}
async function vGrupos(){
  $('#main').innerHTML = '<div class="kick">Grupos</div><h1>Grupos y roles</h1><p class="hint">Cargando…</p>';
  try { await cargarPart(); }
  catch (x) { $('#main').innerHTML = `<div class="kick">Grupos</div><h1>Grupos y roles</h1><p class="err">${esc(U.errMsg(x))}</p>`; return; }
  const act = PART.filter(p => p.activo), pub = filasDe(PART), sinGrupo = act.filter(p => !p.grupo);
  const enGrupo = new Set(pub.map(f => f.pid));
  $('#main').innerHTML = `<div class="kick">Grupos</div><h1>Grupos y roles</h1>
    <p class="lede">Forme los grupos con las personas conectadas ahora. Cada celular muestra su grupo, su rol y las reglas. Rote los roles entre rondas: así cambia el piloto y se reparte el consumo de las cuentas gratuitas.</p>
    <div class="stats"><span><b>${act.length}</b>activos (últimos ${G_VENTANA_MIN} min)</span><span><b>${PART.length}</b>registrados</span><span><b>${new Set(pub.map(f => f.grupo)).size}</b>grupos publicados</span></div>
    <div class="card-box"><div class="kick">Formar</div>
      <div class="g-opc"><label class="field"><span>Cómo</span><select id="g-modo"><option value="area" ${G_OPC.modo === 'area' ? 'selected' : ''}>Por área</option><option value="mezclados" ${G_OPC.modo === 'mezclados' ? 'selected' : ''}>Mezclados</option></select></label>
      <label class="field"><span>Tamaño</span><select id="g-tam">${[3, 4, 5].map(n => `<option ${G_OPC.tam === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
      <p class="hint">Por área: cada área con 3 o más arma sus grupos; quien queda solo en su área se suma al grupo más pequeño, y si son 3 o más forman una mesa mixta. Los escalones altos se reparten entre grupos.</p>
      <div class="prompt-a" style="padding:12px 0 0"><button class="btn" data-gformar="1" ${act.length ? '' : 'disabled'}>Formar grupos</button><button class="btn alt" data-grefrescar="1">Actualizar activos</button></div></div>
    ${PREV ? `<div class="card-box previa"><div class="kick">Vista previa · aún no la ven los celulares</div><p class="hint">Mueva a quien haga falta y publique.</p>
        <div class="prompt-a" style="padding:12px 0 0"><button class="btn" data-gpublicar="1">Publicar grupos</button><button class="btn alt" data-gdescartar="1">Descartar</button></div></div>${tablaGrupos(PREV, true)}` : ''}
    ${!PREV && pub.length ? `<div class="card-box"><div class="kick">Publicados</div>${sinGrupo.length ? `<p class="hint"><b>${sinGrupo.length} ${sinGrupo.length === 1 ? 'persona activa sin grupo' : 'personas activas sin grupo'}:</b> ${esc(sinGrupo.map(p => p.corto).join(', '))} · vuelva a formar o agréguelas a mano.</p>` : ''}
        <div class="prompt-a" style="padding:12px 0 0"><button class="btn" data-grotar="1">Rotar roles</button><button class="btn alt" data-gcopiar="1">Copiar grupos</button><button class="btn alt" data-gborrar="1">${armadoGrupos ? 'Toque otra vez para borrar' : 'Borrar grupos'}</button></div></div>
      ${tablaGrupos(pub, false)}
      ${sinGrupo.length ? `<div class="card-box"><div class="kick">Sin grupo</div>${sinGrupo.map(p => `<div class="adm-row grp-row"><span><span class="t">${esc(p.corto)}</span><br><span class="m">${esc(p.area || '')}</span></span>
        <select class="mini" aria-label="Agregar a ${esc(p.corto)}" data-agregar="${esc(p.id)}"><option value="">Agregar a…</option>${[...new Set(pub.map(f => f.grupo))].sort((a, b) => a - b).map(n => `<option value="${n}">Grupo ${n}</option>`).join('')}<option value="nuevo">Grupo nuevo</option></select></div>`).join('')}</div>` : ''}` : ''}
    ${!PREV && !pub.length ? '<p class="hint" style="margin-top:14px">No hay grupos publicados.</p>' : ''}`;
}
/* Texto plano de los grupos publicados: para armar las salas de Teams y pegarlo en el chat de la reunión */
function textoGrupos(filas){
  const por = {}; filas.forEach(f => (por[f.grupo] = por[f.grupo] || []).push(f));
  const P = id => PART.find(p => p.id === id) || {};
  const rol = r => GRUPOS.ROLES[r] ? GRUPOS.ROLES[r].t : r;
  return ['Grupos de hoy · cada grupo va a su sala con el mismo número', '']
    .concat(Object.keys(por).sort((a, b) => a - b).flatMap(g => {
      const m = por[g].sort((a, b) => a.orden - b.orden);
      return [`Grupo ${g} · ${m[0].mesa || 'Mesa mixta'}`].concat(m.map(f => `- ${P(f.pid).corto || '?'} · ${rol(f.rol)}`), ['']);
    }))
    .concat([`Su grupo, su rol y las reglas también están en el tablero: ${linkPart()}`]).join('\n');
}
async function guardarGrupos(filas, msg){
  try { await DB.gruposGuardar(filas); if (msg) U.toast(msg); } catch (x) { U.toast(U.errMsg(x)); }
  await vGrupos();
}

async function render(){ U.PROMPTS.length = 0; tabs(); if (TAB === 'sesion') await vSesion(); if (TAB === 'acts') vActs(); if (TAB === 'enc') await vEnc(); if (TAB === 'grupos') await vGrupos(); if (TAB === 'muro') await vMuro(); }
async function op(o, p){ try { await DB.admin(o, p); S = await DB.getSesion(); await render(); } catch (x) { U.toast(U.errMsg(x)); } }

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab){ TAB = b.dataset.tab; armadoBorrar = false; armadoGrupos = false; return render(); }
  if (b.dataset.hab) return op('habilitar', { ids: [b.dataset.hab], on: b.getAttribute('aria-checked') !== 'true' });
  if (b.dataset.cap){ const c = U.cap(b.dataset.cap); await DB.admin('habilitar', { ids: c.tarjetas.map(x => x.id), on: true }).catch(() => {}); return op('actual', { id: S.actual === c.id ? null : c.id }); }
  if (b.dataset.foco){ const id = b.dataset.foco; if (S.actual !== id) await DB.admin('habilitar', { ids: [id], on: true }).catch(() => {}); return op('actual', { id: S.actual === id ? null : id }); }
  if (b.dataset.nivel){ const N = NIVELES.find(x => String(x.id) === b.dataset.nivel); return op('habilitar', { ids: N.capitulos.flatMap(c => c.tarjetas.map(x => x.id)), on: b.dataset.on === '1' }); }
  if (b.dataset.enc){ ENC_VER = b.dataset.enc; return op('encuesta', { id: S.encuesta === b.dataset.enc ? null : b.dataset.enc }); }
  if (b.dataset.ver){ ENC_VER = b.dataset.ver; return render(); }
  if (b.dataset.mues){ ENC_VER = b.dataset.mues; return op('muestra', { id: S.muestra === b.dataset.mues ? null : b.dataset.mues }); }
  if (b.dataset.est) return op('estado_pub', { id: Number(b.dataset.est), estado: b.dataset.val });
  if (b.dataset.cp) return U.copiar(linkPart());
  if (b.dataset.csv) return csvGrabacion();
  if (b.dataset.csvpub) return csvPublicaciones();
  if (b.dataset.gformar){
    G_OPC = { modo: $('#g-modo').value, tam: Number($('#g-tam').value) };
    try { await cargarPart(); } catch (x) { return U.toast(U.errMsg(x)); }
    const act = PART.filter(p => p.activo);
    PREV = conCasos(GRUPOS.asignar(GRUPOS.formar(act, { modo: G_OPC.modo, tam: G_OPC.tam, areas: G_AREAS })));
    return vGrupos();
  }
  if (b.dataset.gdescartar){ PREV = null; return vGrupos(); }
  if (b.dataset.gpublicar){ const f = PREV; PREV = null; return guardarGrupos(f, '<i>✓</i> Grupos publicados.'); }
  if (b.dataset.grefrescar) return vGrupos();
  if (b.dataset.gcopiar) return U.copiar(textoGrupos(filasDe(PART)));
  if (b.dataset.grotar) return guardarGrupos(GRUPOS.rotar(filasDe(PART)), '<i>✓</i> Roles rotados.');
  if (b.dataset.gborrar){ if (!armadoGrupos) { armadoGrupos = true; return vGrupos(); } armadoGrupos = false; return guardarGrupos([], 'Grupos borrados.'); }
  if (b.dataset.borrar){ if (!armadoBorrar) { armadoBorrar = true; return render(); } armadoBorrar = false; return op('borrar_todo'); }
});

/* Mover o agregar a mano (select) */
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.mover){
    if (el.dataset.previa) { PREV = ajustarMesas(GRUPOS.mover(PREV, el.dataset.mover, el.value)); return vGrupos(); }
    return guardarGrupos(ajustarMesas(GRUPOS.mover(filasDe(PART), el.dataset.mover, el.value)), '<i>✓</i> Movido.');
  }
  if (el.dataset.agregar && el.value){
    const filas = filasDe(PART), p = PART.find(x => x.id === el.dataset.agregar);
    filas.push({ pid: p.id, grupo: 0, rol: 'apoyo', mesa: p.area || '', orden: 999 });
    return guardarGrupos(ajustarMesas(GRUPOS.mover(filas, p.id, el.value)), '<i>✓</i> Agregado.');
  }
});

async function arrancar(){
  S = await DB.getSesion(); await grabacion(); await render();
  setInterval(async () => {
    try { S = await DB.getSesion(); } catch (e) { return; }
    await grabacion();
    const f = JSON.stringify(S), cambio = f !== firma; firma = f;
    if (TAB !== 'grupos' && (TAB === 'enc' || TAB === 'muro' || cambio)) await render();   // en Grupos no se repinta solo: no cierra un «Mover a…» abierto
  }, Math.max(5000, IAAB_CONFIG.POLL_MS || 4000));
}
U.demoBanner();
if (DB.clave) DB.admin('login').then(arrancar).catch(login); else login();
</script>
